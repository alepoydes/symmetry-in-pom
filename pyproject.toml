[project]
name = "fourfold-polarization-images"
version = "0.1.0"
description = "Reproducible figure code for the PRL manuscript"
readme = "REPRODUCTION.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.0",
    "numpy>=2.5.0",
    "pillow>=12.0.0",
    "scipy>=1.18.0",
    "topovec[mgl]==0.1.17",
]

[project.optional-dependencies]
simulation = ["topovec[cuda,ti]==0.1.17"]

[project.urls]
Repository = "https://github.com/alepoydes/symmetry-in-pom"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["code/src/toronoptics"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["code/tests"]
